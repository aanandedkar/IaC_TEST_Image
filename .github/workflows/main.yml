name: Qualys IaC Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  qualys-iac-scan:
    runs-on: ubuntu-latest
    container:
      image: aanandedkarqualys/qiac:1.0.9.0-test
      env:
        QUALYS_URL: ${{ secrets.QUALYS_URL }}
        AUTH_TYPE: ${{ secrets.AUTH_TYPE }}
        # For BasicAuth
        QUALYS_USERNAME: ${{ secrets.QUALYS_USERNAME }}
        QUALYS_PASSWORD: ${{ secrets.QUALYS_PASSWORD }}
        # For OIDC / IDP
        QUALYS_CLIENTID: ${{ secrets.QUALYS_CLIENTID }}
        QUALYS_CLIENTSECRET: ${{ secrets.QUALYS_CLIENTSECRET }}
        # For IDP only
        TOKEN_URL: ${{ secrets.TOKEN_URL }}
        SCOPE: ${{ secrets.SCOPE }}
        AUDIENCE: ${{ secrets.AUDIENCE }}
        BREAK_ON_ERROR: ${{ secrets.BREAK_ON_ERROR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Run Qualys IaC Scan
        run: sh /home/qiac/github.sh

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualys-iac-report
          path: |
            qualys_iac_github_report.json
            cli_output
            scan_response_*.json
